<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    :root { font-family: Inter, ui-sans-serif, system-ui, sans-serif; background:none !important; background-color:rgba(0,0,0,0) !important; }
    * { box-sizing: border-box; }
    html, body { background:none !important; background-color:rgba(0,0,0,0) !important; }
    body { margin:0; padding:10px 0; color:#f6f2ff; overflow:hidden; }
    .picker { width:100%; display:flex; flex-direction:column; gap:17px; align-items:center; padding:14px 0 12px;
      border:0; border-radius:0; background:transparent; box-shadow:none; backdrop-filter:none; }
    .dial {
      position:relative; isolation:isolate; z-index:1; width:min(540px,100%); aspect-ratio:1; height:auto; border-radius:50%; cursor:pointer;
      background: radial-gradient(circle at 48% 38%, #342956 0 46%, #151127 73%);
      border: 2px solid rgba(195,153,255,.62);
      box-shadow: inset 0 0 62px rgba(115,82,210,.24), 0 18px 52px rgba(0,0,0,.34),0 0 45px rgba(166,112,255,.18);
      user-select: none; touch-action: none;
    }
    .dial::before,.dial::after{content:"";position:absolute;border-radius:50%;pointer-events:none;z-index:-1}
    .dial::before{inset:-22px;border:1px solid rgba(178,135,255,.23);box-shadow:0 0 32px rgba(119,102,255,.11)}
    .dial::after{inset:-45px;border:1px dashed rgba(105,218,255,.16);animation:orbit-spin 34s linear infinite}
    .orbit-dot{position:absolute;width:9px;height:9px;border-radius:50%;pointer-events:none;z-index:3;
      background:#8fe8ff;box-shadow:0 0 14px currentColor,0 0 28px currentColor}
    .orbit-dot.one{top:-27px;left:24%;color:#8fe8ff}
    .orbit-dot.two{right:-30px;top:62%;color:#d99cff;background:#d99cff;width:7px;height:7px}
    .orbit-dot.three{bottom:-26px;left:66%;color:#ad91ff;background:#ad91ff;width:6px;height:6px}
    .orbit-dot.four{left:-31px;top:32%;color:#79dfff;background:#79dfff;width:5px;height:5px}
    @keyframes orbit-spin{to{transform:rotate(360deg)}}
    .live-strip{width:100%;display:flex;align-items:center;justify-content:space-between;padding:9px 12px;
      border-top:1px solid rgba(255,255,255,.07);border-bottom:1px solid rgba(255,255,255,.07);
      color:#aaa4bb;font-size:12px;letter-spacing:.04em}
    .live-strip b{color:#d8e8ff;font-size:13px}.live-label{display:flex;align-items:center;gap:8px;text-transform:uppercase;letter-spacing:.12em;font-size:10px;font-weight:800}
    .live-dot{width:7px;height:7px;border-radius:50%;background:#72f5b0;box-shadow:0 0 12px #72f5b0}
    .dial-stage{position:relative;width:100%;display:flex;align-items:center;justify-content:center;padding:38px 0;isolation:isolate}
    .dial-stage::before{content:"";position:absolute;left:0;right:0;top:50%;height:150px;transform:translateY(-50%);z-index:-2;
      background:
        repeating-linear-gradient(0deg,transparent 0 27px,rgba(119,216,255,.18) 28px 30px),
        linear-gradient(90deg,transparent 0 3%,rgba(173,127,255,.30) 3% 18%,rgba(107,220,255,.22) 18% 82%,rgba(173,127,255,.30) 82% 97%,transparent 97%);
      -webkit-mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
    .dial-stage::after{content:"";position:absolute;left:3%;right:3%;top:50%;height:2px;background:linear-gradient(90deg,transparent,#7ae6ff,#c28cff,#7ae6ff,transparent);
      box-shadow:0 -55px 0 rgba(183,139,255,.18),0 55px 0 rgba(104,220,255,.15),0 0 20px rgba(132,174,255,.42);z-index:-1}
    .wing-label{position:absolute;top:50%;transform:translateY(-50%);font-size:10px;font-weight:900;letter-spacing:.22em;color:rgba(199,220,255,.56);writing-mode:vertical-rl}
    .wing-label.left{left:4%}.wing-label.right{right:4%;transform:translateY(-50%) rotate(180deg)}
    .tick { position:absolute; left:50%; top:50%; width:44px; height:44px; margin:-22px;
      display:grid; place-items:center; border-radius:50%; font-size:17px; font-weight:750;
      color: #bdb7d2; pointer-events: none; transition: .16s ease; }
    .tick.active { color: #130d20; background: linear-gradient(135deg,#68dcff,#d685ff); box-shadow: 0 0 22px #a96cff88; }
    .hand { position:absolute; left:50%; top:50%; width:5px; height:168px; border-radius:5px;
      transform-origin: 50% 100%; background: linear-gradient(#75e4ff,#cb83ff); pointer-events: none;
      box-shadow: 0 0 10px #a279ff; }
    .pin { position:absolute; left:50%; top:50%; width:16px; height:16px; margin:-8px;
      border-radius:50%; background:#e5c7ff; box-shadow:0 0 13px #b779ff; pointer-events:none; }
    .panel { width:100%; min-width:0; text-align:center; }
    .eyebrow { color:#a9a1bf; text-transform:uppercase; letter-spacing:.15em; font-size:11px; font-weight:800; }
    .time { font-size: 56px; font-weight: 850; letter-spacing: -.04em; margin: 7px 0 15px; }
    .time span { font-size: 17px; color:#cda5ff; margin-left:5px; letter-spacing:0; }
    .switch { display:grid; grid-template-columns:1fr 1fr; gap:7px; padding:5px; border:1px solid #3b3450;
      border-radius:14px; background:#171421; margin-bottom:10px; }
    button { border:0; color:#bbb4cb; background:transparent; border-radius:10px; padding:9px 8px;
      font:700 13px inherit; cursor:pointer; }
    button.active { color:white; background:linear-gradient(135deg,#3eaccd,#7659df); box-shadow:0 7px 18px #4932a04d; }
    .hint { color:#8f899f; font-size:12px; line-height:1.45; margin-top:11px; }
    .quick-label{margin:15px 0 7px;color:#918aa6;font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
    .presets{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
    .preset{padding:8px 5px;border:1px solid rgba(183,145,255,.22);background:rgba(255,255,255,.035);color:#c9c1db;border-radius:10px;font-size:12px}
    .preset:hover{border-color:#9fdfff;background:rgba(109,191,255,.10);color:white}
    @media(max-width:560px){ body{padding:4px}.picker{padding:14px 8px}.dial-stage{padding:24px 0}.dial{width:min(300px,88vw)}.hand{height:92px}.time{font-size:42px}.tick{font-size:13px}.wing-label{display:none} }
  </style>
</head>
<body>
  <div class="picker">
    <div class="live-strip"><span class="live-label"><i class="live-dot"></i>Local time</span><b id="liveTime">--:--:--</b></div>
    <div class="dial-stage">
      <span class="wing-label left">WAKE</span><span class="wing-label right">QUEST</span>
      <div class="dial" id="dial">
        <i class="orbit-dot one"></i><i class="orbit-dot two"></i>
        <i class="orbit-dot three"></i><i class="orbit-dot four"></i>
        <div class="hand" id="hand"></div><div class="pin"></div>
      </div>
    </div>
    <div class="panel">
      <div class="eyebrow">Your alarm</div>
      <div class="time"><b id="hourText">7</b>:<b id="minuteText">30</b><span id="periodText">AM</span></div>
      <div class="switch"><button id="hourMode" class="active">Hour</button><button id="minuteMode">Minute</button></div>
      <div class="switch"><button id="amButton" class="active">AM</button><button id="pmButton">PM</button></div>
      <div class="hint" id="hint">Click a number on the clock to choose the hour.</div>
      <div class="quick-label">Quick set</div>
      <div class="presets">
        <button class="preset" data-hour="6" data-minute="30">6:30 AM</button>
        <button class="preset" data-hour="7" data-minute="0">7:00 AM</button>
        <button class="preset" data-hour="7" data-minute="30">7:30 AM</button>
        <button class="preset" data-hour="8" data-minute="0">8:00 AM</button>
      </div>
    </div>
  </div>
  <script>
    let state = {hour:7, minute:30, period:"AM"};
    let mode = "hour";
    const dial = document.getElementById("dial"), hand = document.getElementById("hand");
    const hourMode = document.getElementById("hourMode"), minuteMode = document.getElementById("minuteMode");
    const amButton = document.getElementById("amButton"), pmButton = document.getElementById("pmButton");

    function send(type, extra={}) { parent.postMessage({isStreamlitMessage:true,type,...extra},"*"); }
    function setValue() { send("streamlit:setComponentValue", {value:state, dataType:"json"}); }
    function setHeight() { send("streamlit:setFrameHeight", {height: Math.ceil(document.body.scrollHeight)}); }
    function position(el, index, total, radius) {
      const angle = index / total * Math.PI * 2 - Math.PI / 2;
      el.style.transform = `translate(${Math.cos(angle)*radius}px,${Math.sin(angle)*radius}px)`;
    }
    function render() {
      dial.querySelectorAll(".tick").forEach(x=>x.remove());
      const total = mode === "hour" ? 12 : 12;
      const radius = dial.clientWidth * .39;
      for(let i=0;i<total;i++){
        const el=document.createElement("div"); el.className="tick";
        const value = mode === "hour" ? (i===0?12:i) : i*5;
        el.textContent = mode === "hour" ? value : String(value).padStart(2,"0");
        if((mode==="hour" && value===state.hour) || (mode==="minute" && value===state.minute)) el.classList.add("active");
        position(el,i,total,radius); dial.appendChild(el);
      }
      const degrees = mode === "hour" ? state.hour*30 : state.minute*6;
      hand.style.transform = `translate(-50%,-100%) rotate(${degrees}deg)`;
      document.getElementById("hourText").textContent=state.hour;
      document.getElementById("minuteText").textContent=String(state.minute).padStart(2,"0");
      document.getElementById("periodText").textContent=state.period;
      hourMode.classList.toggle("active",mode==="hour"); minuteMode.classList.toggle("active",mode==="minute");
      amButton.classList.toggle("active",state.period==="AM"); pmButton.classList.toggle("active",state.period==="PM");
      document.getElementById("hint").textContent = mode==="hour"
        ? "Click around the clock to choose an hour."
        : "Click anywhere around the clock for an exact minute.";
      setTimeout(setHeight,0);
    }
    function choose(e){
      const r=dial.getBoundingClientRect(), x=e.clientX-(r.left+r.width/2), y=e.clientY-(r.top+r.height/2);
      let deg=(Math.atan2(y,x)*180/Math.PI+90+360)%360;
      if(mode==="hour") { state.hour=Math.round(deg/30)||12; mode="minute"; }
      else state.minute=Math.round(deg/6)%60;
      render(); setValue();
    }
    dial.addEventListener("pointerdown",choose);
    hourMode.onclick=()=>{mode="hour";render()}; minuteMode.onclick=()=>{mode="minute";render()};
    amButton.onclick=()=>{state.period="AM";render();setValue()}; pmButton.onclick=()=>{state.period="PM";render();setValue()};
    document.querySelectorAll(".preset").forEach(button=>button.onclick=()=>{
      state.hour=Number(button.dataset.hour); state.minute=Number(button.dataset.minute); state.period="AM";
      mode="hour"; render(); setValue();
    });
    function updateLiveTime(){
      document.getElementById("liveTime").textContent=new Date().toLocaleTimeString([],{
        hour:"numeric",minute:"2-digit",second:"2-digit",hour12:true
      });
    }
    updateLiveTime(); setInterval(updateLiveTime,1000);
    window.addEventListener("message",e=>{
      if(e.data?.type!=="streamlit:render") return;
      const a=e.data.args||{};
      state={hour:Number(a.hour??7),minute:Number(a.minute??30),period:a.period||"AM"};
      render();
    });
    send("streamlit:componentReady",{apiVersion:1}); render();
  </script>
</body>
</html>
